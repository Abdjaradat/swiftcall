name: swiftcall
description: SwiftCall - Professional Video & Voice Calls + Chat App
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.4

  # Auth
  google_sign_in: ^6.2.1

  # LiveKit (WebRTC)
  livekit_client: ^2.2.0

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.1.0

  # Chat Features
  emoji_picker_flutter: ^2.2.0
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  photo_view: ^0.15.0

  # Audio/Recording
  record: ^5.1.2
  just_audio: ^0.9.40

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Utils
  intl: any
  timeago: ^3.6.1
  uuid: ^4.5.1
  encrypt: ^5.0.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  dio: ^5.6.0
  mime: ^1.0.5
  path: ^1.9.0
  url_launcher: ^6.3.0
  flutter_contacts: ^1.1.9+1
  share_plus: ^10.0.0
  unity_ads_plugin: ^0.3.30
  video_player: ^2.10.1
  chewie: ^1.12.1
  google_maps_flutter: ^2.14.0
  geolocator: ^12.0.0
  geocoding: ^4.0.0

dependency_overrides:
  record_linux:
    path: packages/record_linux
  flutter_webrtc:
    path: packages/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/sounds/
    - assets/fonts/
    - assets/privacy_policy.html

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
