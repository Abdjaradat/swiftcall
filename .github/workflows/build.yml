name: Build & Release SwiftCall

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Android Debug APK
  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    outputs:
      apk_path: build/app/outputs/flutter-apk/app-debug.apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.2'
          cache: true

      - name: Install Android SDK platform 35
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - name: Restore fixed debug keystore (stable SHA-1 for Firebase)
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          echo "✅ SHA-1 for this keystore:"
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android 2>/dev/null | grep "SHA1:"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        id: build_apk
        run: flutter build apk --debug 2>&1 | tee /tmp/build_log.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Show errors on failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "=== KOTLIN / GRADLE ERRORS ==="
          grep -E "^e:|error:|overrides nothing|Unresolved reference|compileDebug" /tmp/build_log.txt || true
          echo "=== LAST 80 LINES ==="
          tail -80 /tmp/build_log.txt
          exit 1

      - name: Rename APK with version
        run: |
          BUILD_NUM=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/SwiftCall-v1.0.$BUILD_NUM.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftCall-Android-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/SwiftCall-v1.0.${{ github.run_number }}.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SwiftCall v1.0.${{ github.run_number }}"
          body: |
            ## تحميل SwiftCall 📲

            **رابط التحميل المباشر للأندرويد** 👇
            اضغط على الملف أدناه لتحميل APK

            ### ما الجديد؟
            - نظام التوكنز والمكافآت
            - تسجيل الدخول بالإيميل + Google
            - تذكرني + نسيت كلمة المرور
            - إعلانات Unity Ads (مكافأة 50 توكن)

            ### كيفية التثبيت
            1. حمّل ملف APK من الأسفل
            2. فعّل "مصادر غير معروفة" في إعدادات الهاتف
            3. افتح الملف وثبّت التطبيق

            > ⚠️ هذا إصدار تجريبي (Debug) للاختبار قبل النشر الرسمي
          files: |
            build/app/outputs/flutter-apk/SwiftCall-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false

  # ───────────────────────────────────────────────────────────────────────────
  # iOS Unsigned IPA
  # ───────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.2'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Pre-cache iOS Flutter artifacts
        run: flutter precache --ios

      - name: Clean Pods (force fresh install)
        run: rm -rf ios/Pods ios/.symlinks ios/Podfile.lock

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r SwiftCall-iOS-unsigned.ipa Payload/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftCall-iOS-unsigned-${{ github.run_number }}
          path: build/ios/ipa/SwiftCall-iOS-unsigned.ipa
          retention-days: 90
