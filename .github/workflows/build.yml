name: Build Debug Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:   # also allows manual trigger from GitHub Actions tab

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Android Debug APK
  # → Downloads directly from the Actions tab → Artifacts.
  # → Enable "Unknown sources" on your phone and open the APK to install.
  # ─────────────────────────────────────────────────────────────────────────────
  android:
    name: Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.2'
          cache: true

      - name: Install Android SDK platform 35
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - name: Print debug keystore SHA-1 (add this to Firebase Console)
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            2>/dev/null | grep -A1 "SHA1:"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        id: build_apk
        run: flutter build apk --debug 2>&1 | tee /tmp/build_log.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Show Kotlin errors
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "=== KOTLIN / GRADLE ERRORS ==="
          grep -E "^e:|error:|overrides nothing|Unresolved reference|compileDebug" /tmp/build_log.txt || true
          echo "=== LAST 80 LINES ==="
          tail -80 /tmp/build_log.txt
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftCall-Android-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS Unsigned IPA
  #
  # Builds an unsigned IPA that can be installed on a real iPhone WITHOUT an
  # Apple Developer account using one of these free tools:
  #
  #   • AltStore   → https://altstore.io  (Windows & Mac)
  #   • Sideloadly → https://sideloadly.io (Windows & Mac)
  #
  # Both tools sign the IPA with your free Apple ID automatically.
  # Free Apple ID = app works for 7 days, then re-sign via the same tool.
  # ─────────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.2'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Pre-cache iOS Flutter artifacts
        run: flutter precache --ios

      - name: Clean Pods (force fresh install)
        run: rm -rf ios/Pods ios/.symlinks ios/Podfile.lock

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r SwiftCall-unsigned.ipa Payload/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftCall-iOS-unsigned-${{ github.run_number }}
          path: build/ios/ipa/SwiftCall-unsigned.ipa
          retention-days: 30
