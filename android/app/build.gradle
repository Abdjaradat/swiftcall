plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Read signing credentials from key.properties (not committed to git)
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.swiftcall.app"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias        keystoreProperties['keyAlias']
                keyPassword     keystoreProperties['keyPassword']
                storeFile       file(keystoreProperties['storeFile'])
                storePassword   keystoreProperties['storePassword']
            } else {
                // CI fallback: read from environment variables
                storeFile     file(System.getenv("RELEASE_KEYSTORE_PATH") ?: rootProject.file('app/ci-debug-key'))
                storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: "android"
                keyAlias      System.getenv("RELEASE_KEY_ALIAS")     ?: "androiddebugkey"
                keyPassword   System.getenv("RELEASE_KEY_PASSWORD")  ?: "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.swiftcall.app"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig    signingConfigs.release
            minifyEnabled    false  // Disabled for compatibility with Android 15
            shrinkResources  false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled   false
            shrinkResources false
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation 'androidx.core:core:1.13.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
}
